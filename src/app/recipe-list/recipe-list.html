<div class="search-container">
  <input
    type="text"
    placeholder="Search recipes..."
    [(ngModel)]="searchTerm"
    class="search-input"
  />
  <button mat-stroked-button (click)="handleAddRecipe()">Add Recipe</button>
</div>

<div class="recipe-selector">
  @for (r of filteredRecipes(); track r.id) {
    <a [routerLink]="['/recipes', r.id]" class="recipe-btn">
      {{ r.name }}
      @if (r.isFavorite) {
        <span class="favorite-star">★</span>
      }
    </a>
  }
</div>
