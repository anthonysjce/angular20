<input type="text" placeholder="Search recipes..." [(ngModel)]="searchTerm"/>
<app-recipe-detail [recipe]="recipe()"></app-recipe-detail>

<div class="recipe-selector">
  @for (r of filteredRecipes(); track r.id) {
    <button (click)="selectRecipe(r)" class="recipe-btn" [class.active]="r.id === recipe().id">
      {{ r.name }}
      @if (r.isFavorite) {
        <span class="favorite-star">★</span>
      }
    </button>
  }
</div>
